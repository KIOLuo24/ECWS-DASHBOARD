<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KIOwork 经营测算看板</title>
  <style>
    :root{color:#172033;background:#f5f7fb;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0}main{padding:32px;max-width:1800px;margin:auto}header{background:linear-gradient(135deg,#172033,#246bfe);color:#fff;border-radius:28px;padding:34px;box-shadow:0 20px 50px #17316c33}header p{margin:0 0 8px;color:#c8d7ff}h1{margin:0;font-size:34px}h2{margin:0;font-size:18px}.grid{display:grid;gap:18px}.cards{grid-template-columns:repeat(4,minmax(0,1fr));margin:22px 0}.two{grid-template-columns:.8fr 1.2fr}.metric,.panel{background:#fff;border:1px solid #e4e9f3;border-radius:22px;box-shadow:0 12px 32px #24406a14}.metric{padding:22px}.metric span{color:#68758b;display:block;margin-bottom:10px}.metric strong{font-size:26px}.panel{padding:20px;margin-bottom:20px}.title{align-items:center;display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}button{background:#246bfe;border:0;border-radius:12px;color:#fff;cursor:pointer;padding:9px 13px}button.icon{background:#eef3ff;color:#246bfe;padding:9px}input{width:100%;border:1px solid #dfe5ef;border-radius:10px;padding:8px;background:#fbfcff}.table-wrap{overflow:auto}table{border-collapse:collapse;min-width:1300px;width:100%}th{background:#f0f4ff;color:#34425c;font-weight:700;position:sticky;top:0}th,td{border:1px solid #e5eaf3;padding:8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}tfoot td{background:#fff7d6;font-weight:800}.row{align-items:end;display:grid;gap:12px;grid-template-columns:1fr 160px 44px;margin:12px 0}.row.product{grid-template-columns:1.3fr 120px 100px 100px 130px 44px}label{color:#68758b;font-size:12px}label input{margin-top:6px}.ok td{background:#f6fff8}.bad td{background:#fff8f8;color:#d92727}@media(max-width:900px){main{padding:16px}.cards,.two{grid-template-columns:1fr}h1{font-size:25px}.row,.row.product{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><div id="root"></div><script>
const uid=()=>Math.random().toString(36).slice(2), years=[1,2,3,4,5];
let state={roles:[{id:uid(),name:'项目经理',salary:10000,headcounts:[1,1,1,1,1]},{id:uid(),name:'开发经理',salary:15000,headcounts:[1,1,1,1,1]},{id:uid(),name:'运维',salary:6000,headcounts:[0,0,1,1,1]},{id:uid(),name:'销售',salary:4000,headcounts:[2,3,4,6,6]},{id:uid(),name:'客服',salary:6000,headcounts:[0,0,1,2,3]}],products:[{id:uid(),name:'建站套餐1',price:2999,commissionRate:.3,reserveRate:.05},{id:uid(),name:'建站套餐2',price:4999,commissionRate:.3,reserveRate:.05},{id:uid(),name:'建站套餐3',price:7999,commissionRate:.3,reserveRate:.05},{id:uid(),name:'运营套餐1',price:13999,commissionRate:.2,reserveRate:.05},{id:uid(),name:'运营套餐2',price:18999,commissionRate:.15,reserveRate:.05},{id:uid(),name:'运营套餐3',price:38999,commissionRate:.1,reserveRate:.05}],costs:[{id:uid(),name:'办公室',amount:60000},{id:uid(),name:'域名',amount:1500},{id:uid(),name:'服务器',amount:8000}],scenarios:[{id:uid(),name:'预测公式',year:5,sales:{}},{id:uid(),name:'第一年签25',year:1,sales:{建站套餐2:36,运营套餐2:24,运营套餐3:12}}]};
const money=v=>Math.round(v*100)/100, currency=v=>{const s=new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(Math.abs(v||0));return v<0?`(${s})`:s};
function calc(){const roleAnnualCosts=Object.fromEntries(state.roles.map(r=>[r.id,r.headcounts.map(c=>c*r.salary*12)]));const salaryByYear=[0,1,2,3,4].map(i=>state.roles.reduce((s,r)=>s+roleAnnualCosts[r.id][i],0));const annualFixedCosts=state.costs.reduce((s,c)=>s+c.amount,0);const byName=Object.fromEntries(state.products.map(p=>[p.name,p]));const scenarios=state.scenarios.map(sc=>{const entries=Object.entries(sc.sales||{});const revenue=money(entries.reduce((s,[n,q])=>s+(byName[n]?.price||0)*q,0));const commission=money(entries.reduce((s,[n,q])=>s+(byName[n]?byName[n].price*byName[n].commissionRate*q:0),0));const reserve=money(entries.reduce((s,[n,q])=>s+(byName[n]?byName[n].price*byName[n].reserveRate*q:0),0));const salaryCost=salaryByYear[Math.min(4,Math.max(0,Number(sc.year||1)-1))]||0;const profit=money(revenue-salaryCost-commission-reserve-annualFixedCosts);return{...sc,revenue,commission,reserve,salaryCost,fixedCost:annualFixedCosts,profit,margin:revenue?`${Math.round(profit/revenue*100)}%`:'#DIV/0!',distribution:{shareholder:profit*.5,projectManager:profit*.1,developmentManager:profit*.1,reinvestment:profit*.2,operationsLoss:profit*.05,bonusPool:profit*.05}}});return{roleAnnualCosts,salaryByYear,annualFixedCosts,scenarios}}
const root=document.getElementById('root'), setState=p=>{state={...state,...p};render()}, input=(v,p,t='number',step=1)=>`<input data-path="${p}" type="${t}" min="0" step="${step}" value="${v??''}">`;
function metric(t,v){return`<article class="metric"><span>${t}</span><strong>${v}</strong></article>`}
function costEditor(){return`<section class="panel"><div class="title"><h2>场地/设备与自定义成本</h2><button data-action="add-cost">＋ 新增</button></div>${state.costs.map((c,i)=>`<div class="row"><label>名称${input(c.name,`costs.${i}.name`,'text')}</label><label>金额${input(c.amount,`costs.${i}.amount`)}</label><button class="icon" data-remove-cost="${i}">删</button></div>`).join('')}</section>`}
function productEditor(){return`<section class="panel"><div class="title"><h2>产品套餐、提成与风险金</h2><button data-action="add-product">＋ 新增套餐</button></div>${state.products.map((p,i)=>`<div class="row product"><label>套餐${input(p.name,`products.${i}.name`,'text')}</label><label>定价${input(p.price,`products.${i}.price`)}</label><label>提成%${input(p.commissionRate*100,`products.${i}.commissionRatePercent`)}</label><label>风险金%${input(p.reserveRate*100,`products.${i}.reserveRatePercent`)}</label><strong>${currency(p.price*p.commissionRate)}/单</strong><button class="icon" data-remove-product="${i}">删</button></div>`).join('')}</section>`}
function scenarioTable(data){return`<section class="panel"><div class="title"><h2>预测公式与年利润分配</h2><button data-action="add-scenario">＋ 新增预测</button></div><div class="table-wrap"><table><thead><tr><th>场景</th><th>第几年工资</th>${state.products.map(p=>`<th>${p.name}</th>`).join('')}<th>收入</th><th>工资成本</th><th>提成</th><th>固定成本</th><th>风险金</th><th>利润</th><th>利润率</th><th>股东50%</th><th>项目经理10%</th><th>开发经理10%</th><th>再投入20%</th><th>运营5%</th><th>奖金池5%</th></tr></thead><tbody>${data.scenarios.map((s,si)=>`<tr class="${s.profit>=0?'ok':'bad'}"><td>${input(s.name,`scenarios.${si}.name`,'text')}</td><td>${input(s.year,`scenarios.${si}.year`)}</td>${state.products.map(p=>`<td>${input(s.sales[p.name]||0,`scenarios.${si}.sales.${p.name}`)}</td>`).join('')}<td>${currency(s.revenue)}</td><td>${currency(s.salaryCost)}</td><td>${currency(s.commission)}</td><td>${currency(s.fixedCost)}</td><td>${currency(s.reserve)}</td><td>${currency(s.profit)}</td><td>${s.margin}</td>${Object.values(s.distribution).map(v=>`<td>${currency(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function render(){const data=calc();root.innerHTML=`<main><header><p>经营测算看板</p><h1>团队、套餐、成本与利润分配，一屏联动测算</h1></header><section class="grid cards">${metric('最高利润',currency(Math.max(...data.scenarios.map(s=>s.profit))))}${metric('年固定成本',currency(data.annualFixedCosts))}${metric('员工年工资峰值',currency(Math.max(...data.salaryByYear)))}${metric('套餐数量',`${state.products.length} 个`)}</section><section class="panel"><div class="title"><h2>团队规模与工资</h2><button data-action="add-role">＋ 新增岗位</button></div><div class="table-wrap"><table><thead><tr><th>人员</th>${years.map(y=>`<th>人数/第${y}年</th>`).join('')}<th>月工资</th>${years.map(y=>`<th>工资/第${y}年</th>`).join('')}<th></th></tr></thead><tbody>${state.roles.map((r,ri)=>`<tr><td>${input(r.name,`roles.${ri}.name`,'text')}</td>${r.headcounts.map((h,hi)=>`<td>${input(h,`roles.${ri}.headcounts.${hi}`)}</td>`).join('')}<td>${input(r.salary,`roles.${ri}.salary`,'number',500)}</td>${data.roleAnnualCosts[r.id].map(v=>`<td>${currency(v)}</td>`).join('')}<td><button class="icon" data-remove-role="${ri}">删</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="7">总工资</td>${data.salaryByYear.map(v=>`<td>${currency(v)}</td>`).join('')}<td></td></tr></tfoot></table></div></section><section class="grid two">${costEditor()}${productEditor()}</section>${scenarioTable(data)}</main>`}
root.addEventListener('input',e=>{const path=e.target.dataset.path;if(!path)return;const parts=path.split('.');let target=state;for(let i=0;i<parts.length-1;i++)target=target[parts[i]];const key=parts.at(-1),value=e.target.type==='number'?Number(e.target.value||0):e.target.value;if(key==='commissionRatePercent')target.commissionRate=value/100;else if(key==='reserveRatePercent')target.reserveRate=value/100;else target[key]=value;render()});
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const a=button.dataset.action;if(a==='add-role')setState({roles:[...state.roles,{id:uid(),name:'新岗位',salary:6000,headcounts:[0,0,0,0,0]}]});if(a==='add-cost')setState({costs:[...state.costs,{id:uid(),name:'新成本',amount:0}]});if(a==='add-product')setState({products:[...state.products,{id:uid(),name:'新套餐',price:0,commissionRate:.1,reserveRate:.05}]});if(a==='add-scenario')setState({scenarios:[...state.scenarios,{id:uid(),name:'新预测',year:1,sales:{}}]});['role','cost','product'].forEach(kind=>{const index=button.dataset[`remove${kind[0].toUpperCase()}${kind.slice(1)}`];if(index!==undefined)setState({[`${kind}s`]:state[`${kind}s`].filter((_,i)=>i!==Number(index))})})});
render();
</script></body></html>
